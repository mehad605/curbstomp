name: CI

on:
  push:
    branches:
      - main
      - 'refactor/**'
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-verify:
    name: Test, Lint & Release Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Test release scripts
        run: bash .github/scripts/test-release-scripts.sh

      - name: Set up JDK 17
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-read-only: ${{ github.event_name != 'push' }}

      - name: Run unit tests, Android Lint, and release APK build
        run: |
          ./gradlew test lint assembleRelease \
            --build-cache \
            --no-daemon \
            --console=plain \
            -Dorg.gradle.jvmargs="-Xmx4g -XX:+UseParallelGC" \
            -PVERSION_NAME="0.0.0-ci" \
            -PVERSION_CODE="1"

      - name: Verify debug-signed release APK metadata and footprint
        run: bash .github/scripts/verify-release-apk.sh app/build/outputs/apk/release/Curbstomp-release.apk "0.0.0-ci" "1" --allow-debug-cert

      - name: Upload test and lint reports on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-failure-reports
          path: |
            app/build/reports/lint-results-debug.html
            app/build/reports/tests/
          if-no-files-found: ignore
          retention-days: 7
